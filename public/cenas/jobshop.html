/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

:root, :root[data-theme='light'], :root[data-theme='dark'] { --bg: #11131d; --brand: #2952e3; --ink: #0e1018; --card: #151a2b; --line: #2a3150; --txt: #e9ecf5; --dim: #9aa3bf; --warn: #f2b11c; --late: #ff6b5a; }
html, body { background: var(--bg); }
#app { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--txt); }
#gl { image-rendering: pixelated; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.ui { position: absolute; inset: 0; pointer-events: none; }
.ui button { font: inherit; color: inherit; }
.badge { position: absolute; left: 16px; top: 14px; font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); background: rgba(14,16,24,.72); border: 1px solid var(--line); padding: 7px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
.badge .dot { width: 7px; height: 7px; background: var(--warn); border-radius: 1px; }
.hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 13px; color: var(--dim); background: rgba(14,16,24,.72); border: 1px solid var(--line); padding: 7px 12px; border-radius: 6px; transition: opacity .3s; white-space: nowrap; }
.hint.gone { opacity: 0; }
.tag { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: 600; background: var(--brand); color: #fff; padding: 6px 10px; border-radius: 4px; white-space: nowrap; opacity: 0; transition: opacity .15s; box-shadow: 0 0 0 2px var(--ink); }
.tag b { font: 700 12px 'JetBrains Mono', monospace; opacity: .75; margin-right: 4px; }
.tag.on { opacity: 1; }
.tag::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: var(--brand); }

.rail { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
.step { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: rgba(14,16,24,.82); padding: 8px 11px; border-radius: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap; color: var(--dim) !important; transition: background .15s, color .15s, border-color .15s; }
.step b { font: 700 11px 'JetBrains Mono', monospace; color: var(--warn); }
.step:hover, .step:focus-visible { color: var(--txt) !important; border-color: #4a5480; outline: none; }
.step.on { background: var(--brand); border-color: var(--brand); color: #fff !important; }
.step.on b { color: #fff; }

.panel { position: absolute; right: 16px; top: 14px; bottom: 64px; width: min(360px, 42vw); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 14px; pointer-events: auto; overflow: auto; transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.16,1,.3,1); box-shadow: 0 14px 40px rgba(0,0,0,.45); }
.panel.open { transform: none; }
.panel .close { position: absolute; right: 10px; top: 8px; background: none; border: 0; font-size: 22px; color: var(--dim); cursor: pointer; line-height: 1; padding: 4px 6px; }
.p-step { font: 600 11px 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
.panel h2 { margin: 6px 0 10px; font-size: 21px; line-height: 1.2; font-weight: 700; }
.live { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--txt); background: rgba(41,82,227,.14); border: 1px solid rgba(41,82,227,.4); padding: 8px 10px; border-radius: 6px; margin: 0 0 14px; min-height: 18px; }
.pulse { width: 8px; height: 8px; flex: none; background: #3fd06a; border-radius: 50%; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.p-sub { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.list { display: grid; gap: 8px; }
.os { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; text-align: left; background: #1b2136; border: 1px solid var(--line); border-radius: 6px; padding: 10px 11px; cursor: pointer; transition: border-color .15s, background .15s; }
.os:hover, .os:focus-visible { border-color: var(--brand); background: #1e2640; outline: none; }
.os-n { font: 700 12px 'JetBrains Mono', monospace; color: #8fb0ff; }
.os-eq { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.os-who { font-size: 12px; color: var(--dim); }
.bar { grid-column: 1 / -1; height: 6px; background: #0f1322; border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); }
.os.late .bar i { background: var(--late); }
.os-t { grid-column: 1 / -1; font: 500 11.5px 'JetBrains Mono', monospace; color: var(--dim); }
.os.late .os-t { color: var(--late); }
.foot { font-size: 12px; color: var(--dim); margin: 12px 0 0; }

.ficha .back { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 0; font-size: 12.5px; margin-bottom: 12px; }
.ficha .back:hover { color: var(--txt); }
.f-head { display: grid; gap: 3px; margin-bottom: 14px; }
.f-head b { font: 700 18px 'JetBrains Mono', monospace; color: #8fb0ff; }
.f-head span { font-size: 16px; font-weight: 700; }
.f-head small { font-size: 12.5px; color: var(--dim); }
.trilho { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 0; }
.trilho li { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); position: relative; padding: 6px 0; }
.trilho li i { width: 14px; height: 14px; border: 2px solid #3a4366; border-radius: 3px; flex: none; background: var(--card); position: relative; z-index: 1; }
.trilho li:not(:last-child)::after { content: ''; position: absolute; left: 6px; top: 22px; height: 14px; width: 2px; background: #3a4366; }
.trilho li.done { color: var(--txt); }
.trilho li.done i { background: #3fd06a; border-color: #3fd06a; }
.trilho li.done::after { background: #3fd06a !important; }
.trilho li.now { color: #fff; font-weight: 700; }
.trilho li.now i { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(41,82,227,.3); }
.ficha dl { margin: 0; display: grid; gap: 8px; }
.ficha dl div { display: flex; justify-content: space-between; font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
.ficha dt { color: var(--dim); }
.ficha dd { margin: 0; font-weight: 600; }

.cursor { position: absolute; left: 0; top: 0; margin: -2px 0 0 -2px; opacity: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); will-change: transform; }
.cursor svg { display: block; transition: transform .12s; }
.cursor.click svg { transform: scale(.82); }

@media (max-width: 719px) {
  .hint { display: none; }
  .panel { left: 10px; right: 10px; top: auto; bottom: 60px; width: auto; max-height: 46%; transform: translateY(calc(100% + 80px)); }
  .panel.open { transform: none; }
  .rail { left: 10px; right: 10px; transform: none; justify-content: flex-start; }
  .step span { display: none; }
  .step.on span { display: inline; }
}
